---
# Used for RHEL/CentOS/Fedora only. Allows the use of different repos.
redis_enablerepo: epel

redis_enabled: true

# -----------------------------------------------------------------------------
# Redis process/network settings.
# -----------------------------------------------------------------------------
redis_daemonize: "no"
redis_pidfile: ""
redis_port: 6379
redis_bind_interface: 127.0.0.1
redis_unixsocket: /run/redis/redis.sock
redis_unixsocketperm: "770"
redis_protected_mode: "yes"

redis_timeout: 0
redis_tcp_backlog: 511
redis_tcp_keepalive: 300
redis_hz: 10
redis_dynamic_hz: "yes"

redis_loglevel: "notice"
redis_logfile: /var/log/redis/redis-server.log

redis_databases: 16

# Set to an empty set to disable persistence (saving the DB to disk).
redis_save:
  - '""'

redis_rdbcompression: "yes"
redis_dbfilename: dump.rdb
redis_dbdir: /var/lib/redis

redis_maxmemory: 1gb
redis_maxmemory_policy: "volatile-lru"
redis_maxmemory_samples: 5
redis_lazyfree_lazy_eviction: "yes"
redis_lazyfree_lazy_expire: "yes"
redis_lazyfree_lazy_server_del: "yes"
redis_lazyfree_lazy_user_del: "yes"
redis_activedefrag: "no"

redis_appendonly: "yes"
redis_appendfsync: "everysec"
redis_auto_aof_rewrite_percentage: 100
redis_auto_aof_rewrite_min_size: 256mb

# Add extra include files for local configuration/overrides.
redis_includes: []

# Require authentication to Redis with a password.
redis_requirepass: ""

# ACL users as complete Redis directives, e.g.
# - 'user default off'
# - 'user phpapp on >S3cret ~* +@all'
redis_acl_users: []

# Disable certain Redis commands for security reasons.
redis_disabled_commands:
  - FLUSHALL
  - FLUSHDB
  - CONFIG
  - SHUTDOWN
  # - KEYS
  # - PEXPIRE
  # - DEL
  # - BGREWRITEAOF
  # - BGSAVE
  # - SAVE
  # - SPOP
  # - SREM
  # - RENAME
  # - DEBUG

redis_extra_config: ""

# -----------------------------------------------------------------------------
# System tuning (kernel + systemd) for Redis.
# -----------------------------------------------------------------------------
redis_manage_system_tuning: true

# Persisted in /etc/sysctl.d/99-redis.conf and applied immediately.
redis_sysctl_settings:
  vm.overcommit_memory: "1"
  net.core.somaxconn: "1024"

# Transparent Huge Pages tuning.
redis_disable_thp: true
redis_thp_enabled_value: "never"
redis_thp_defrag_value: "never"

# Redis service override in systemd drop-in.
redis_manage_systemd_override: true
redis_systemd_limit_nofile: 100000
redis_systemd_umask: "007"
